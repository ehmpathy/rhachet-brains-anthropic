name: publish

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # per [workflow] x [branch, tag]
  cancel-in-progress: true #  cancel workflows for non-latest commits

# ⚠️ this block is required, and its absence is silent — the same defect
# `test.yml` carried.
#
# both workflows this one calls declare `permissions: id-token: write` for oidc:
# `.test.yml` (aws) and `.publish-npm.yml` (npm provenance). a caller may only
# grant a permission it holds itself, so without this block the call is
# unsatisfiable and github rejects it at PARSE time — a 0s `startup_failure`
# that emits NO check runs at all.
#
# ⚠️ this workflow fires only on a `v*` tag, so it runs a handful of times a year.
# it last ran green on 2026-07-28, BEFORE the default permission tightened, and
# had not run since — so it sat latent-broken, and the next release would have
# been the first to discover it. `test.yml` broke the same way for the same
# reason, and its repair is the controlled experiment that predicts this one: to
# restore this block, and only this block, took it from `startup_failure` to green.
#
# the peer repos on this template carry the block; this repo had lost it.
permissions:
  id-token: write # required for oidc
  contents: read

jobs:
  test:
    uses: ./.github/workflows/.test.yml
    with:
      creds-aws-region: us-east-1
      creds-aws-role-arn: ${{ vars.CREDS_CICD_AWS_DEV_OIDC_ROLE_ARN }} # use aws auth via oidc, if this repo supplies it
    secrets:
      openai-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  publish:
    uses: ./.github/workflows/.publish-npm.yml
    needs: [test]
