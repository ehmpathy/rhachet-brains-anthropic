name: test

on:
  workflow_call:
  push:
    branches-ignore:
      - main # exclude main branch, since deploy workflow triggers on main, and calls the test workflow inside of it already
    tags-ignore:
      - v* # exclude tags, since deploy workflow triggers on tags, and calls the test workflow inside of it already

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # per [workflow] x [branch, tag]
  cancel-in-progress: true #  cancel workflows for non-latest commits

# ⚠️ this block is load-bearing, and its absence is silent.
#
# `.test.yml` declares `permissions: id-token: write` for its aws oidc step. a
# caller may only grant permissions it holds itself, so a caller that omits this
# block hands down the default — and once the default tightened to read-only,
# the call became unsatisfiable.
#
# github rejects that at PARSE time: a 0s `startup_failure` with no job, no
# annotation, and no error text reachable through the api. and because this
# workflow triggers on `push` rather than `pull_request`, the failed run is not
# a PR check either — so `rhx git.release` reported "all checks passed" while
# the suite never ran once between 2026-07-28 and this commit.
#
# the sibling repos on this template carry the block; this repo had lost it.
permissions:
  id-token: write # required for oidc
  contents: read

jobs:
  suite:
    uses: ./.github/workflows/.test.yml
    with:
      creds-aws-region: us-east-1
      creds-aws-role-arn: ${{ vars.CREDS_CICD_AWS_DEV_OIDC_ROLE_ARN }} # use aws auth via oidc, if this repo supplies it
    secrets:
      openai-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
