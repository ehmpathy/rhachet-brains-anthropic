ignores:
  - depcheck
  - declapract
  - declapract-typescript-ehmpathy
  - '@commitlint/config-conventional'
  - serverless-prune-plugin
  - husky
  - if-env
  - rhachet
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - tsx
  - "@src/*"
  - "@src/.*"
  - rhachet-roles-bhrain
  - rhachet-roles-bhuild
  - rhachet-roles-ehmpathy
  - tsc-alias
  - yalc
  - rhachet-brains-anthropic
  # .note = no import names it, so depcheck cannot see it. rhachet discovers brains
  #   by a walk of THIS package's declared deps, so the fireworks brain must be a
  #   direct devDependency for `rhx review --brain fireworks/...` to find it. as a
  #   peer of rhachet-roles-bhrain alone it stays invisible, and every peer reviewer
  #   halts with BrainChoiceNotFoundError.
  - rhachet-brains-fireworksai
